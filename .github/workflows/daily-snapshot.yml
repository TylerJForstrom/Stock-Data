name: Daily symbol snapshot

on:
  schedule:
    # Odd minute, off the congested top of hour; GitHub cron is best-effort
    # (5-60+ min jitter, occasional skips) and the job is a watermark-style
    # snapshot, so exact timing does not matter.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out TickerPulse for its derived metrics
        # Public repo, so the default token reaches it. Only the archive/ tree is
        # read, and only reviewed aggregate fields cross into this repository —
        # see src/stock_data/tickerpulse.py.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TylerJForstrom/TickerPulse
          path: tickerpulse
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check prior snapshot freshness
        # Run before collection so missed cadences make the scheduled run red.
        # The following always() steps still self-heal and publish the archive.
        run: |
          # Every clock reports independently. GitHub's default shell is
          # `bash -e`, so a chained gate would abort at the FIRST stale dataset
          # and skip every later check — silencing the cross-coverage clocks
          # exactly when something is already broken, which is when they are
          # the whole point. Same accumulator idiom as Stock-Grader's
          # monthly-forward-backtest.yml: one refusal must not suppress the rest.
          set -uo pipefail
          set +e
          rc=0
          stock-data check-staleness --max-age-days 2 data/symbols/current data/symbols/events || rc=1
          # The pit tables are rebuilt by this same job; a stale manifest means
          # the build step has been failing while snapshots advance.
          if [ -f data/symbols/pit/manifest.json ]; then
            stock-data check-staleness --max-age-days 2 data/symbols/pit || rc=1
          fi
          # Cross-coverage: the weekly sweep's clock is checked daily so a
          # disabled weekly workflow cannot fail silently.
          if [ -f data/events/manifest.json ]; then
            stock-data check-staleness --max-age-days 8 data/events || rc=1
          fi
          # Sentiment is a forward-only clock (ECOSYSTEM.md Rule 4): a day not
          # captured is gone. Bootstrap-guarded so the first run is not red.
          if [ -f data/sentiment/ticker_buckets/manifest.json ]; then
            stock-data check-staleness --max-age-days 3 data/sentiment/ticker_buckets || rc=1
          fi
          # Cross-coverage for the weekly corporate-actions sweep, same guard
          # as that workflow's own gate: armed only once the manifest declares
          # an all-listed sweep (the legacy 3-ticker dataset must not alarm).
          if grep -q '"tickers_failed"' data/corporate_actions/manifest.json 2>/dev/null; then
            stock-data check-staleness --max-age-days 9 data/corporate_actions || rc=1
          fi
          exit $rc
      - name: Snapshot symbol directories
        if: always()
        run: stock-data snapshot-symbols --data-dir data
      - name: Rebuild point-in-time membership intervals
        # Derived dataset: the event replay runs once here at the producer and
        # data/symbols/pit/ is republished in the same commit that advances
        # current/ + events/, so consumers (grader universe(asof)) always see a
        # table in lockstep with the stream it replays. Runs even when the
        # snapshot step failed: the previous current/events pair is still
        # self-consistent, so the rebuild is too.
        if: always()
        run: stock-data build-pit --data-dir data
      - name: Mirror TickerPulse derived metrics
        # TickerPulse metrics enter the grader through the foundry, never
        # directly (ECOSYSTEM.md Rule 2). Independent of the symbol snapshot, so
        # neither failing costs the other its day.
        if: always()
        run: stock-data sentiment-snapshot --data-dir data --archive-dir tickerpulse/archive
      - name: Commit results (heartbeat always)
        # Runs even when the snapshot step failed: the heartbeat file records
        # the failure and committing it resets GitHub's 60-day scheduled-workflow
        # inactivity timer, so the archive cannot silently stop.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          # Rebase-retry: a concurrent commit on main must not discard the snapshot.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main || exit 1
          done
          exit 1

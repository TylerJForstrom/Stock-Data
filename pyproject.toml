[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data"
version = "0.1.0"
description = "Data foundry: archives and derives industry-standard equity datasets from free primary sources (SEC EDGAR, exchange directories, Treasury)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tyler Forstrom" }]
dependencies = [
    "requests>=2.34.2",
    "pandas>=2.0",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    # Real stubs rather than silencing the missing-import error: pandas is used
    # for exactly one call (dividends -> parquet), and typing it costs nothing.
    "pandas-stubs>=2.0",
]

[project.scripts]
stock-data = "stock_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
# 3.12, matching the interpreter CI actually runs. It was pinned to 3.11 (the
# requires-python floor), which made mypy abort before checking a single file
# of ours: numpy ships .pyi stubs using PEP 695 `type` statements, and under
# --python-version 3.11 that is a syntax error, so the whole run died with
# "1 error, errors prevented further checking". Type-checking the interpreter
# under test beats type-checking nothing.
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
# No blanket ignore_missing_imports: pandas is typed via the pandas-stubs dev
# dependency instead, so a genuinely untyped new import is a visible decision.

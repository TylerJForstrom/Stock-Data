[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data"
version = "0.1.0"
description = "Data foundry: archives and derives industry-standard equity datasets from free primary sources (SEC EDGAR, exchange directories, Treasury)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tyler Forstrom" }]
dependencies = [
    "requests>=2.34.2",
    "pandas>=2.0",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.16.1",
    "mypy>=1.8",
]

[project.scripts]
stock-data = "stock_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
